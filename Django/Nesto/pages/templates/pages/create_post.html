
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Create Post - Nesto</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        #location-map {
            height: 280px;
            width: 100%;
            z-index: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-700 min-h-screen py-10 px-4 antialiased">

<div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60">

    <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">
            Create a Post
        </h1>
        <a href="{% url 'home' %}"
        class="text-sm font-medium text-slate-500 hover:text-slate-900 transition">
            ✕ Cancel
        </a>
    </div>

    <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
        <button id="tab-community" type="button"
                onclick="switchTab('community')"
                class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition">
            💬 Community Discussion
        </button>

        <button id="tab-guide" type="button"
                onclick="switchTab('guide')"
                class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition">
            🗺️ City Guide Entry
        </button>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <input type="hidden" name="post_type" id="post_type_input" value="community">

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                Title *
            </label>
            <input type="text" name="title" required
                placeholder="Give your post a descriptive title..."
                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                Content / Body *
            </label>
            <textarea name="content" rows="4" required
                    placeholder="Write details here..."
                    class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition"></textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                Attachment / Photo
            </label>
            <input type="file" name="image" accept="image/*"
                class="w-full text-sm text-slate-500 border border-dashed border-slate-300 rounded-xl p-2.5 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
        </div>

        <div id="guide-fields" class="hidden space-y-5 pt-5 border-t border-slate-100">
            <h3 class="text-base font-bold text-teal-700">
                City Guide Settings
            </h3>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Category *
                </label>
                <select name="category" id="category_select"
                        onchange="handleCategoryChange()"
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                    <option value="">-- Select a Category --</option>

                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}

                    <option value="new">+ Create New Category</option>
                </select>
            </div>

            <div id="new_category_box" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    New Category Name *
                </label>
                <input type="text" name="new_category" id="new_category_input"
                        placeholder="e.g. Parks, PG & Homes, Cafes"
                        disabled
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
            </div>

            <div id="entity_box" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Entity / Spot *
                </label>
                <select name="entity" id="entity_select"
                        onchange="handleEntityChange()"
                        disabled
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                    <option value="">-- Select an Entity --</option>
                    <option value="new">+ Add New Entity</option>
                </select>
            </div>

            <div id="entity_details_box"
                class="hidden space-y-4 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">

                <div id="new_entity_name_box" class="hidden">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Entity Name *
                    </label>
                    <input type="text" name="new_entity" id="new_entity_input"
                        placeholder="e.g. Room 101, Central Park, Blue Tokai Cafe"
                        disabled
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                </div>

                <div id="map_picker_box" class="hidden space-y-2">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                            Pin the Location on Map
                        </label>
                        <p class="text-xs text-slate-500 mb-3">
                            Click the map to place a pin. You can move it by clicking again.
                        </p>
                    </div>

                    <div id="location-map"
                        class="rounded-xl border border-slate-300 overflow-hidden">
                    </div>

                    <p id="map-status" role="status"
                        class="text-xs text-slate-500">
                        Loading map...
                    </p>

                    <p id="map-coordinates" class="text-xs text-slate-500">
                        No location selected yet.
                    </p>

                    <input type="hidden" name="latitude" id="latitude_input">
                    <input type="hidden" name="longitude" id="longitude_input">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                            Price / Fee
                        </label>
                        <input type="text" name="price" id="price_input"
                            placeholder="e.g. ₹8,000/mo or Free"
                            class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                            Location / Address
                        </label>
                        <input type="text" name="location" id="location_input"
                            placeholder="e.g. Sector 62, Noida"
                            class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-700">
                            Custom Attributes
                        </label>
                        <button type="button" onclick="addAttributeRow('', '')"
                                class="text-xs text-teal-700 hover:text-teal-900 font-semibold bg-teal-50 hover:bg-teal-100 px-2.5 py-1 rounded-lg transition">
                            + Add Attribute
                        </button>
                    </div>

                    <p class="text-xs text-slate-500 mb-3">
                        Add details like Opening Hours, Wifi, Parking, Sharing, etc.
                    </p>

                    <div id="attributes_container" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <button type="submit"
                class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 font-bold rounded-xl text-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2">
            Publish Post
        </button>
    </form>
</div>

<script>
    const MAPBOX_TOKEN = "pk.eyJ1IjoibGF6YXJ1czIwMDYiLCJhIjoiY212Z3N6dTQ5MDEydTJ3cXkxMnkzaXFqdiJ9.ViOLzHLA4n6acyNk4EyFPg";
    const categoriesData = {{ categories_json|safe }};

    let locationMap = null;
    let locationMarker = null;

    function switchTab(type) {
        document.getElementById('post_type_input').value = type;

        const tabComm = document.getElementById('tab-community');
        const tabGuide = document.getElementById('tab-guide');
        const guideFields = document.getElementById('guide-fields');

        if (type === 'community') {
            tabComm.className =
                'flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition';
            tabGuide.className =
                'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition';

            guideFields.classList.add('hidden');
        } else {
            tabGuide.className =
                'flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition';
            tabComm.className =
                'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition';

            guideFields.classList.remove('hidden');
        }
    }

    function handleCategoryChange() {
        const catSelect = document.getElementById('category_select');
        const catId = catSelect.value;

        const newCatBox = document.getElementById('new_category_box');
        const newCatInput = document.getElementById('new_category_input');
        const entityBox = document.getElementById('entity_box');
        const entitySelect = document.getElementById('entity_select');
        const container = document.getElementById('attributes_container');

        container.innerHTML = '';
        resetMapSelection();

        document.getElementById('entity_details_box').classList.add('hidden');
        document.getElementById('new_entity_name_box').classList.add('hidden');

        newCatInput.disabled = catId !== 'new';
        entitySelect.disabled = !catId;

        if (catId === 'new') {
            newCatBox.classList.remove('hidden');
            entityBox.classList.remove('hidden');

            entitySelect.innerHTML =
                '<option value="new" selected>+ Add New Entity</option>';

            handleEntityChange();
            return;
        }

        if (catId) {
            newCatBox.classList.add('hidden');
            entityBox.classList.remove('hidden');

            const catData = categoriesData[catId];
            let options = '<option value="">-- Select an Entity --</option>';

            if (catData && catData.entities) {
                catData.entities.forEach(ent => {
                    const option = document.createElement('option');
                    option.value = ent.id;
                    option.textContent = ent.name;
                    options += option.outerHTML;
                });
            }

            options += '<option value="new">+ Add New Entity</option>';
            entitySelect.innerHTML = options;

            if (catData && catData.default_attributes) {
                catData.default_attributes.forEach(attrName => {
                    addAttributeRow(attrName, '');
                });
            }

            return;
        }

        newCatBox.classList.add('hidden');
        entityBox.classList.add('hidden');
    }

    function handleEntityChange() {
        const entitySelect = document.getElementById('entity_select');
        const entityVal = entitySelect.value;
        const detailsBox = document.getElementById('entity_details_box');
        const newEntityNameBox = document.getElementById('new_entity_name_box');
        const newEntityInput = document.getElementById('new_entity_input');
        const mapPicker = document.getElementById('map_picker_box');
        const catId = document.getElementById('category_select').value;
        const container = document.getElementById('attributes_container');

        if (!entityVal) {
            detailsBox.classList.add('hidden');
            newEntityNameBox.classList.add('hidden');
            mapPicker.classList.add('hidden');
            newEntityInput.disabled = true;
            return;
        }

        detailsBox.classList.remove('hidden');

        if (entityVal === 'new') {
            newEntityNameBox.classList.remove('hidden');
            newEntityInput.disabled = false;

            document.getElementById('price_input').value = '';
            document.getElementById('location_input').value = '';
            container.innerHTML = '';

            resetMapSelection();
            mapPicker.classList.remove('hidden');

            initializeLocationMap();
            return;
        }

        newEntityNameBox.classList.add('hidden');
        newEntityInput.disabled = true;
        mapPicker.classList.add('hidden');

        const catData = categoriesData[catId];
        if (!catData) return;

        const entity = catData.entities.find(
            item => String(item.id) === String(entityVal)
        );

        if (!entity) return;

        document.getElementById('price_input').value = entity.price || '';
        document.getElementById('location_input').value = entity.location || '';

        container.innerHTML = '';

        if (entity.attributes) {
            Object.entries(entity.attributes).forEach(([key, value]) => {
                addAttributeRow(key, value);
            });
        }
    }

    function resetMapSelection() {
        document.getElementById('latitude_input').value = '';
        document.getElementById('longitude_input').value = '';

        document.getElementById('map-coordinates').textContent =
            'No location selected yet.';

        if (locationMarker && locationMap) {
            locationMap.removeLayer(locationMarker);
            locationMarker = null;
        }
    }

    function initializeLocationMap() {
        const mapElement = document.getElementById('location-map');
        const status = document.getElementById('map-status');

        if (!mapElement) return;

        if (typeof L === 'undefined') {
            status.textContent =
                'Leaflet could not load. Check your internet connection or script blocker.';
            return;
        }

        if (typeof locationMap === 'undefined' || !locationMap) {
            const latStr = "{{ user.profile.city.latitude|default_if_none:'' }}";
            const lngStr = "{{ user.profile.city.longitude|default_if_none:'' }}";
            const defaultLat = latStr ? parseFloat(latStr) : 20.5937;
            const defaultLng = lngStr ? parseFloat(lngStr) : 78.9629;
            const defaultZoom = latStr ? 12 : 5;
            window.locationMap = L.map(mapElement).setView([defaultLat, defaultLng], defaultZoom);

            L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`, {
                maxZoom: 19,
                attribution: '© Mapbox'
            }).addTo(window.locationMap);
        }

            locationMap.on('click', function (event) {
                const lat = event.latlng.lat;
                const lng = event.latlng.lng;
                if (locationMarker) {
                    locationMarker.setLatLng(event.latlng);
                } else {
                    locationMarker = L.marker(event.latlng).addTo(locationMap);
                }

                document.getElementById('latitude_input').value =
                    lat.toFixed(6);

                document.getElementById('longitude_input').value =
                    lng.toFixed(6);

                document.getElementById('map-coordinates').textContent =
                    `Selected: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            });
        }

        status.textContent = 'Click the map to place a pin.';

        requestAnimationFrame(() => {
            if (locationMap) {
                locationMap.invalidateSize();
            }
        });
    }

    function addAttributeRow(key = '', val = '') {
        const container = document.getElementById('attributes_container');
        const row = document.createElement('div');

        row.className = 'flex gap-2 items-center';

        const keyInput = document.createElement('input');
        keyInput.type = 'text';
        keyInput.name = 'attr_keys[]';
        keyInput.placeholder = 'Attribute (e.g. Timings)';
        keyInput.value = key;
        keyInput.className =
            'w-1/2 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition';

        const valueInput = document.createElement('input');
        valueInput.type = 'text';
        valueInput.name = 'attr_values[]';
        valueInput.placeholder = 'Value (e.g. 9 AM - 10 PM)';
        valueInput.value = val;
        valueInput.className =
            'w-1/2 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition';

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = '✕';
        removeButton.setAttribute('aria-label', 'Remove attribute');
        removeButton.className =
            'text-slate-400 hover:text-red-600 font-bold text-sm px-1.5 transition';
        removeButton.addEventListener('click', () => row.remove());

        row.append(keyInput, valueInput, removeButton);
        container.appendChild(row);
    }
</script>

</body>
</html>
