<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Nesto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen py-10 px-4 antialiased">

    <div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60">
        
        <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Create a Post</h1>
            <a href="{% url 'home' %}" class="text-sm font-medium text-slate-500 hover:text-slate-900 transition">✕ Cancel</a>
        </div>

        <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
            <button id="tab-community" type="button" onclick="switchTab('community')" 
                class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition">
                💬 Community Discussion
            </button>
            <button id="tab-guide" type="button" onclick="switchTab('guide')" 
                class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition">
                🗺️ City Guide Entry
            </button>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="post_type" id="post_type_input" value="community">

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Title *</label>
                <input type="text" name="title" required placeholder="Give your post a descriptive title..." 
                    class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Content / Body *</label>
                <textarea name="content" rows="4" required placeholder="Write details here..." 
                    class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Attachment / Photo</label>
                <input type="file" name="image" accept="image/*"
                    class="w-full text-sm text-slate-500 border border-dashed border-slate-300 rounded-xl p-2.5 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
            </div>

            <div id="guide-fields" class="hidden space-y-5 pt-5 border-t border-slate-100">
                <h3 class="text-base font-bold text-teal-700">City Guide Settings</h3>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Category *</label>
                    <select name="category" id="category_select" onchange="handleCategoryChange()" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                        <option value="">-- Select a Category --</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                        <option value="new" class="text-teal-700 font-bold">+ Create New Category</option>
                    </select>
                </div>

                <div id="new_category_box" class="hidden">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">New Category Name *</label>
                    <input type="text" name="new_category" id="new_category_input" placeholder="e.g. Parks, PG & Homes, Cafes" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                </div>

                <div id="entity_box" class="hidden">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Entity / Spot *</label>
                    <select name="entity" id="entity_select" onchange="handleEntityChange()" 
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                        <option value="">-- Select an Entity --</option>
                        <option value="new" class="text-teal-700 font-bold">+ Add New Entity</option>
                    </select>
                </div>

                <div id="entity_details_box" class="hidden space-y-4 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">
                    
                    <div id="new_entity_name_box" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Entity Name *</label>
                        <input type="text" name="new_entity" id="new_entity_input" placeholder="e.g. Room 101, Central Park, Blue Tokai Cafe" 
                            class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Price / Fee</label>
                            <input type="text" name="price" id="price_input" placeholder="e.g. ₹8,000/mo or Free" 
                                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Location / Address</label>
                            <input type="text" name="location" id="location_input" placeholder="e.g. Sector 62, Noida" 
                                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-semibold text-slate-700">Custom Attributes</label>
                            <button type="button" onclick="addAttributeRow('', '')" 
                                class="text-xs text-teal-700 hover:text-teal-900 font-semibold bg-teal-50 hover:bg-teal-100 px-2.5 py-1 rounded-lg transition">+ Add Attribute</button>
                        </div>
                        <p class="text-xs text-slate-500 mb-3">Add details like Opening Hours, Wifi, Parking, Sharing, etc.</p>
                        
                        <div id="attributes_container" class="space-y-2"></div>
                    </div>

                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 font-bold rounded-xl text-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2">
                Publish Post
            </button>
        </form>

    </div>

    <script>
        const categoriesData = {{ categories_json|safe }};

        function switchTab(type) {
            document.getElementById('post_type_input').value = type;
            const tabComm = document.getElementById('tab-community');
            const tabGuide = document.getElementById('tab-guide');
            const guideFields = document.getElementById('guide-fields');

            if (type === 'community') {
                tabComm.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition";
                tabGuide.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition";
                guideFields.classList.add('hidden');
            } else {
                tabGuide.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-teal-700 shadow-sm transition";
                tabComm.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition";
                guideFields.classList.remove('hidden');
            }
        }

        function handleCategoryChange() {
            const catSelect = document.getElementById('category_select');
            const catId = catSelect.value;
            const newCatBox = document.getElementById('new_category_box');
            const entityBox = document.getElementById('entity_box');
            const entitySelect = document.getElementById('entity_select');
            const container = document.getElementById('attributes_container');

            container.innerHTML = ''; 

            if (catId === 'new') {
                newCatBox.classList.remove('hidden');
                entityBox.classList.remove('hidden');
                entitySelect.innerHTML = `<option value="new" selected>+ Add New Entity</option>`;
                handleEntityChange();
            } else if (catId !== '') {
                newCatBox.classList.add('hidden');
                entityBox.classList.remove('hidden');
                
                const catData = categoriesData[catId];
                let options = `<option value="">-- Select an Entity --</option>`;
                if (catData && catData.entities) {
                    catData.entities.forEach(ent => {
                        options += `<option value="${ent.id}">${ent.name}</option>`;
                    });
                }
                options += `<option value="new" class="text-teal-700 font-bold">+ Add New Entity</option>`;
                entitySelect.innerHTML = options;

                if (catData && catData.default_attributes) {
                    catData.default_attributes.forEach(attrName => {
                        addAttributeRow(attrName, '');
                    });
                }
                handleEntityChange();
            } else {
                newCatBox.classList.add('hidden');
                entityBox.classList.add('hidden');
                document.getElementById('entity_details_box').classList.add('hidden');
            }
        }

        function handleEntityChange() {
            const entitySelect = document.getElementById('entity_select');
            const entityVal = entitySelect.value;
            const detailsBox = document.getElementById('entity_details_box');
            const newEntityNameBox = document.getElementById('new_entity_name_box');
            const catId = document.getElementById('category_select').value;
            const container = document.getElementById('attributes_container');

            if (!entityVal) {
                detailsBox.classList.add('hidden');
                return;
            }

            detailsBox.classList.remove('hidden');

            if (entityVal === 'new') {
                newEntityNameBox.classList.remove('hidden');
                document.getElementById('price_input').value = '';
                document.getElementById('location_input').value = '';
            } else {
                newEntityNameBox.classList.add('hidden');
                
                const catData = categoriesData[catId];
                if (catData) {
                    const entity = catData.entities.find(e => e.id == entityVal);
                    if (entity) {
                        document.getElementById('price_input').value = entity.price || '';
                        document.getElementById('location_input').value = entity.location || '';
                        
                        container.innerHTML = '';
                        if (entity.attributes) {
                            Object.entries(entity.attributes).forEach(([k, v]) => {
                                addAttributeRow(k, v);
                            });
                        }
                    }
                }
            }
        }

        function addAttributeRow(key = '', val = '') {
            const container = document.getElementById('attributes_container');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center';
            row.innerHTML = `
                <input type="text" name="attr_keys[]" value="${key}" placeholder="Attribute (e.g. Timings)" 
                    class="w-1/2 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                <input type="text" name="attr_values[]" value="${val}" placeholder="Value (e.g. 9 AM - 10 PM)" 
                    class="w-1/2 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-red-600 font-bold text-sm px-1.5 transition" aria-label="Remove attribute">✕</button>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
