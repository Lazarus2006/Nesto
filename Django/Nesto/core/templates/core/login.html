{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nesto - Login</title>

    <link rel="stylesheet" href="{% static 'core/login.css' %}">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="login-container">

        <h1>Welcome to Nesto</h1>

        <p class="subtitle">
            Log in to continue to Nesto
        </p>

        <!-- Google Login -->
        <div id="g_id_onload"
            data-client_id="1029347229246-bu81nu9n2tt3ves998im4mk6r1k69eel.apps.googleusercontent.com"
            data-callback="handleGoogleLogin">
        </div>

        <div class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="continue_with"
            data-shape="rectangular">
        </div>

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Django Login -->
        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Password"
                required
            >

            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}

            <button type="submit" id="continue-btn">
                Continue
            </button>

        </form>

        <p class="signup-text">
            New to Nesto?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>

    </div>


</body>
</html>
