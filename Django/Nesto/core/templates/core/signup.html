{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nesto - Sign Up</title>

    <link rel="stylesheet" href="{% static 'core/signup.css' %}">
</head>

<body>

    <div class="signup-container">

        <h1>Nesto</h1>
        <p class="welcome">Create your account</p>

        <form method="POST" action="{% url 'signup' %}">

            {% csrf_token %}

            <div class="input-group">
                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="id_email">Email</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="id_password1">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        name="password1"
                        id="id_password1"
                        placeholder="Create a password"
                        required
                    >
                    <button type="button" class="password-toggle" data-toggle-password="id_password1" aria-controls="id_password1" aria-pressed="false">Show</button>
                </div>
            </div>

            <div class="input-group">
                <label for="id_password2">Confirm Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        name="password2"
                        id="id_password2"
                        placeholder="Confirm your password"
                        required
                    >
                    <button type="button" class="password-toggle" data-toggle-password="id_password2" aria-controls="id_password2" aria-pressed="false">Show</button>
                </div>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {{ form.errors }}
                </div>
            {% endif %}

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p class="signin-text">
            Already have an account?
            <a href="{% url 'login' %}">Sign In</a>
        </p>

    </div>

    <script>
        document.querySelectorAll("[data-toggle-password]").forEach((button) => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.togglePassword);
                const isVisible = input.type === "text";
                input.type = isVisible ? "password" : "text";
                button.textContent = isVisible ? "Show" : "Hide";
                button.setAttribute("aria-pressed", String(!isVisible));
            });
        });
    </script>

</body>
</html>
